esphome:
  name: scsbticino-managed-test

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [scs_bticino]

scs_bticino:
  id: scs
  rx_pin: GPIO4
  tx_pin: GPIO3

button:
  - platform: template
    name: SCS Test Send Channel 23
    on_press:
      - scs_bticino.send:
          id: scs
          type: short
          payload: [0x96, 0xA3, 0x6F, 0xA4]
      - delay: 2s
      - scs_bticino.send:
          id: scs
          type: short
          payload: [0x96, 0xA3, 0x6F, 0xA0]
